name: Build APK
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
      - name: Fullscreen on Android (hide status and navigation bars)
        run: |
          mkdir -p android/app/src/main/java/com/erwan/plusoumoins
          cat > android/app/src/main/java/com/erwan/plusoumoins/MainActivity.java <<'JAVA'
          package com.erwan.plusoumoins;

          import android.os.Build;
          import android.os.Bundle;
          import android.view.Window;
          import android.view.WindowManager;
          import android.webkit.JavascriptInterface;
          import androidx.core.graphics.Insets;
          import androidx.core.view.ViewCompat;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import androidx.core.view.WindowInsetsControllerCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              Window w = getWindow();
              // Draw behind the status bar and the camera notch: no grey band at the top
              WindowCompat.setDecorFitsSystemWindows(w, false);
              if (Build.VERSION.SDK_INT >= 28) {
                WindowManager.LayoutParams lp = w.getAttributes();
                lp.layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;
                w.setAttributes(lp);
              }
              // Lets the page know how tall the camera notch is, so nothing is hidden under it
              getBridge().getWebView().addJavascriptInterface(new Object() {
                @JavascriptInterface
                public int safeTop() {
                  WindowInsetsCompat i = ViewCompat.getRootWindowInsets(getWindow().getDecorView());
                  if (i == null) return 0;
                  Insets c = i.getInsets(WindowInsetsCompat.Type.displayCutout());
                  return Math.round(c.top / getResources().getDisplayMetrics().density);
                }
              }, "PMNative");
              hideBars();
            }

            @Override
            public void onWindowFocusChanged(boolean hasFocus) {
              super.onWindowFocusChanged(hasFocus);
              if (hasFocus) hideBars();
            }

            private void hideBars() {
              Window w = getWindow();
              WindowInsetsControllerCompat c = WindowCompat.getInsetsController(w, w.getDecorView());
              c.hide(WindowInsetsCompat.Type.systemBars());
              c.setSystemBarsBehavior(WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);
            }
          }
          JAVA
      - name: Use the same signing key every build (so updates install over the old app)
        run: |
          mkdir -p ~/.android
          cp keys/debug.keystore ~/.android/debug.keystore
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk PlusOuMoins.apk
      - uses: actions/upload-artifact@v4
        with:
          name: plus-ou-moins-apk
          path: PlusOuMoins.apk
      - name: Publish the release (main branch only)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest PlusOuMoins.apk \
            --title "Plus ou Moins - dernière version" \
            --notes "Télécharge **PlusOuMoins.apk** ci-dessous, ouvre-le sur ton téléphone Android et installe-le (autorise les sources inconnues si Android le demande). Mis à jour à chaque modification du jeu." \
            --latest
