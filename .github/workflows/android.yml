name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
      - name: Fullscreen on Android (hide status and navigation bars)
        run: |
          mkdir -p android/app/src/main/java/com/erwan/plusoumoins
          cat > android/app/src/main/java/com/erwan/plusoumoins/MainActivity.java <<'JAVA'
          package com.erwan.plusoumoins;

          import android.os.Bundle;
          import android.view.Window;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import androidx.core.view.WindowInsetsControllerCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              hideBars();
            }

            @Override
            public void onWindowFocusChanged(boolean hasFocus) {
              super.onWindowFocusChanged(hasFocus);
              if (hasFocus) hideBars();
            }

            private void hideBars() {
              Window w = getWindow();
              WindowInsetsControllerCompat c = WindowCompat.getInsetsController(w, w.getDecorView());
              c.hide(WindowInsetsCompat.Type.systemBars());
              c.setSystemBarsBehavior(WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);
            }
          }
          JAVA
      - name: Use the same signing key every build (so updates install over the old app)
        run: |
          mkdir -p ~/.android
          cp keys/debug.keystore ~/.android/debug.keystore
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk PlusOuMoins.apk
      - uses: actions/upload-artifact@v4
        with:
          name: plus-ou-moins-apk
          path: PlusOuMoins.apk
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest PlusOuMoins.apk \
            --title "Plus ou Moins - dernière version" \
            --notes "Télécharge **PlusOuMoins.apk** ci-dessous, ouvre-le sur ton téléphone Android et installe-le (autorise les sources inconnues si Android le demande). Mis à jour à chaque modification du jeu." \
            --latest
